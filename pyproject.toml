[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-agent"
version = "0.1.0"
description = "Independent local AI agent with explicit data-egress controls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "asyncssh>=2.20",
    "fastapi>=0.115",
    "greenlet>=3.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
    "redis>=6.0",
    "regex>=2024.11",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.31",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
    "types-regex>=2024.11",
]

[project.scripts]
agent = "agent.main:run"
agent-worker = "agent.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/agent/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent"]
