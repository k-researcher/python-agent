id = "spa-deep-links"
class = "simple"
fix_commit = "dd4ecf38ee2be2fb17b24c16491e5a14e47af1b4"
prompt = """\
Веб-интерфейс — это SPA. При открытии прямой ссылки на страницу входа или на сессию
(/s/<id>) или при обновлении страницы сервер не отдаёт index.html, и интерфейс не
загружается: пользователь видит ошибку. При этом любые неизвестные пути сейчас могут
отдаваться одинаковым fallback.

Нужно отдавать index.html для пустого пути, страницы входа и маршрутов сессии /s/<id>,
а для всех остальных неизвестных путей возвращать 404. Отдаваться должны только файлы
внутри каталога собранного фронтенда: попытки доступа наружу через .. или симлинки должны
отклоняться, как и случаи отсутствующего или зацикленного index.html.
Наблюдается в обработчике раздачи статики фронтенда.
Интерфейс: логику отдачи файлов интерфейса вынести в новый модуль agent.frontend с функцией
`def frontend_response(directory: Path, path: str) -> FileResponse | JSONResponse`.
"""
tests = ["tests/unit/test_frontend.py"]
check = "pytest -q tests/unit/test_frontend.py"
max_steps = 60
max_seconds = 1800
