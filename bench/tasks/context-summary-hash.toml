prompt = """\
Для экономии контекста сессии её история сжимается в сводку, а при загрузке истории
используется контрольная точка сводки. Сейчас загрузчик берёт первую подходящую сводку без
проверки, покрывает ли она реальные текущие строки: после правки ветки или переключения
истории в контекст попадает сводка, описывающая скрытую или изменённую ветку, а «сырые»
строки под сводкой при этом теряются.

Нужно использовать сводку только когда сохранённый хэш покрываемых ею строк всё ещё
совпадает с текущими строками (скрытые и изменённые строки тоже учитываются в хэше). Если
годной сводки нет — загружать полную историю без сводных строк, отказавшись от них, а не
показывать пользователю сводку чужих изменений.
Наблюдается в загрузке истории и контрольных точек контекста.
Интерфейс: в модуле agent.checkpoints нужна функция
`async def stored_source_hash(db: AsyncSession, session_id: str, covers_until: int) -> str`,
которая возвращает хеш строк истории, сохранённый вместе со сводкой.
"""
tests = [
