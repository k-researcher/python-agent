id = "network-public-addresses"
class = "simple"
fix_commit = "6c24401a9d2ac1e3e3dabab84e42fb5520832b7d"
prompt = """\
При исходящих HTTP-запросах агент разрешает имя хоста и подключается только к разрешённым
адресам из списка. Сейчас фильтр пропускает некоторые непубличные адреса: общий диапазон
CGNAT (100.64.0.0/10), документационные и бенчмаркинговые диапазоны, а также IPv4-отображённые
IPv6-адреса. Кроме того, зависший DNS-запрос не ограничен по времени, а переменные окружения
SSL_CERT_FILE и SSL_CERT_DIR могут подменить хранилище доверенных сертификатов.

Нужно, чтобы к сети подключался только публичный unicast-адрес: любой адрес, который не
является публичным unicast, должен отклоняться с понятной ошибкой. DNS-запрос и все попытки
соединения должны укладываться в единый таймаут. Сертификаты и проверка имени хоста не должны
изменяться окружением.
Наблюдается в модуле проверки и установления исходящих сетевых соединений.
"""
tests = ["tests/unit/test_network_pinning.py"]
check = "pytest -q tests/unit/test_network_pinning.py"
max_steps = 60
max_seconds = 1800
