prompt = """\
Работа с деревом сообщений (правка, регенерация, переключение веток) требует владения
сессией. Сейчас на закэшированной строке сессии с истёкшим сроком аренды владельца операция
падает с TypeError, а сессия с владельцем без известного срока аренды ошибочно считается
свободной, из-за чего форк может забрать «живую» сессию. Регенерация к тому же проверяет
выбранную модель и уровень рассуждений по устаревшей копии состояния сессии.

Нужно, чтобы решение о том, свободна ли сессия, принимала база данных в одной транзакции с
изменением, а кэшированная строка обновлялась после захвата. Владелец без срока аренды должен
считаться живьём, и такую сессию нельзя ни редактировать, ни форкать. Параметры регенерации
должны валидироваться по состоянию сессии, прочитанному после захвата прав.
Наблюдается в модуле дерева сообщений сессии.
"""
tests = ["tests/integration/test_message_tree.py"]
check = "pytest -q tests/integration/test_message_tree.py"
