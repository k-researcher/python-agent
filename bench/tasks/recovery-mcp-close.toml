id = "recovery-mcp-close"
class = "recovery"
fix_commit = "2e730274f096ea27320e9fd65d56a25a7716b3fa"
prompt = """
При выходе из сессии агент закрывает подключения к доверенным источникам MCP-инструментов.
Если закрытие одного клиента падает с ошибкой, эта ошибка всплывает наружу и маскирует
исходную причину завершения работы: например, вместо отмены задачи пользователь видит
служебные подробности внутренней ошибки закрытия, в том числе секретные строки из команд
запуска сервера. При этом остальные источники уже могли не закрыться до конца.

Нужно, чтобы ошибка закрытия клиента никогда не вытесняла уже возникшее исключение и
была скрыта от пользователя обобщённым сообщением. Если работа источника уже была отменена
(отмена во время запуска или при самом закрытии), результат должен оставаться отменой —
никакая ошибка закрытия не должна превращать отмену в инструментальную ошибку.
Клиенты всех источников должны всё равно корректно закрываться по очереди.
Наблюдается в модуле управления жизненным циклом доверенных источников при завершении
сессии.
"""
tests = ["tests/unit/test_source_lifecycle_cleanup.py"]
check = "pytest -q tests/unit/test_source_lifecycle_cleanup.py"
interrupt_after_steps = 6
max_steps = 60
max_seconds = 1800
