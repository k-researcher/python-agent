# Структура моделей (базовый слой). UI может переопределять поля поверх этого файла.
# Ключи здесь не хранятся: api_key_env — имя переменной из окружения или .env.
# Проверка: uv run pyagent config check
providers:
  gateway:
    kind: openai
    base_url: https://llm.example.com/v1
    api_key_env: AGENT_LLM_API_KEY
    timeout_seconds: 120
    max_retries: 3

  # --- Шаблоны других провайдеров: раскомментируйте нужные ---
  # anthropic:                      # адаптер Messages API пока не готов
  #   kind: anthropic
  #   base_url: https://api.anthropic.com/v1
  #   api_key_env: ANTHROPIC_API_KEY
  # openai:                         # адаптер Responses API пока не готов
  #   kind: openai_responses
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY
  # glm:                            # Z.ai GLM (для Китая: https://open.bigmodel.cn/api/paas/v4)
  #   kind: openai
  #   base_url: https://api.z.ai/api/paas/v4
  #   api_key_env: ZAI_API_KEY
  # local_server:                   # локальный сервер
  #   kind: openai
  #   base_url: http://127.0.0.1:1234/v1
  #   api_key_env: null
  # mlx:                            # mlx_lm.server (по умолчанию тоже 8080 — смените порт)
  #   kind: openai
  #   base_url: http://127.0.0.1:8081/v1
  #   api_key_env: null
  # ollama:
  #   kind: openai
  #   base_url: http://127.0.0.1:11434/v1
  #   api_key_env: null

models:
  main:                             # основная модель агента
    provider: gateway
    model: deepseek-v4-flash
    context_window: 256000
    max_tokens: 16000
    # Пример: шлюз LiteLLM понимает только «выкл/вкл»: "none" выключает рассуждения,
    # любой другой уровень включает их без регулировки силы (проверено 2026-10-06).
    reasoning:
      supported: true
      allowed_efforts: [none, high]
      default_effort: high
      wire_parameter: reasoning_effort
      history: current_turn             # рассуждения возвращаются модели в цикле инструментов
  light:                            # служебные задачи (названия, суммаризация) и fallback
    provider: gateway
    model: gemma-4-26b
    context_window: 256000
    max_tokens: 8192
    reasoning: {supported: false}
  # local:                          # локальная модель
  #   provider: local_server
  #   model: local-model-id         # точный ID модели на сервере
  #   context_window: 8192          # = длина контекста, с которой модель загружена
  #   max_tokens: 2048
  #   reasoning:
  #     supported: false
  #     # Пример разделителей блока размышлений; задайте теги своей модели.
  #     tags: {start: "<|reasoning>", end: "<reasoning|>"}
  #   # Без цены бюджет сессии с денежным потолком остановит запуск (cost_unknown).
  #   pricing: {input_per_mtok: 0, output_per_mtok: 0}

routing:
  default: main
  # ID моделей (не провайдеров); используются после исчерпания повторов при сбоях.
  fallback: [light]
  roles: {}
  # Модель для служебных задач: сводки контекста и названия сессий. Нет поля — default.
  light: light

decisions:                          # слой решений, пока выключен
  enabled: false
